name: Manual Opportunity Ingestion Scan

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Recruiting Commission / Authority'
        required: true
        type: choice
        options:
          - upsc
          - ssc
          - isro
          - drdo
          - ibps
          - pmrf
        default: 'upsc'
      url:
        description: 'Optional direct notice URL or PDF link to process'
        required: false
        type: string
        default: ''

jobs:
  scan:
    name: Ingest Single Source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements.txt'

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Execute Manual Scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL || '@cf/meta/llama-3.1-8b-instruct' }}
          ENVIRONMENT: 'production'
        run: |
          python -m engine.app.jobs.manual_scan_job --source "${{ inputs.source }}" --url "${{ inputs.url }}"

