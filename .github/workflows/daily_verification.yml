name: Scheduled Daily URL & Integrity Verification Engine

on:
  schedule:
    # 01:00 UTC = 06:30 IST every morning
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum number of opportunities to audit in this execution'
        required: false
        type: string
        default: '250'
      dry_run:
        description: 'Perform read-only link and deadline audit without writing changes'
        type: boolean
        required: false
        default: false
      force:
        description: 'Force re-verification regardless of last verification timestamp'
        type: boolean
        required: false
        default: false

concurrency:
  group: rexam-daily-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Audit Link Health, Verify URLs & Sync Lifecycles
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Execute Daily Verification Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENVIRONMENT: 'production'
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          eval "python -m engine.app.jobs.daily_verification_job $ARGS"

      - name: Upload Run Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-verification-failure-diagnostics
          path: |
            /tmp/rexam_verification_diagnostics.log
          retention-days: 7

