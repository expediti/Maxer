name: Scheduled Opportunity Discovery & Extraction

on:
  schedule:
    # 01:00 UTC = 06:30 IST every morning
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      force_rescan:
        description: 'Bypass document deduplication cache'
        type: boolean
        required: false
        default: false

jobs:
  discover:
    name: Crawl & Ingest Indian Opportunities
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements.txt'

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Execute Discovery & Extraction Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL || '@cf/meta/llama-3.1-8b-instruct' }}
          ENVIRONMENT: 'production'
          RATE_LIMIT_DELAY_SECONDS: '2.0'
        run: |
          python -m engine.app.jobs.discovery_job

      - name: Upload Run Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-failure-diagnostics
          path: /tmp/rexam_downloads/
          retention-days: 7

