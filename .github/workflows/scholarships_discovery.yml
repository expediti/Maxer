name: Scheduled Indian Scholarship Discovery

on:
  schedule:
    # 02:00 UTC = 07:30 IST every morning
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_rescan:
        description: 'Bypass document deduplication cache'
        type: boolean
        required: false
        default: false

jobs:
  scholarship_discovery:
    name: Crawl & Ingest Indian Scholarships
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements.txt'

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Execute Scholarship Discovery Job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL || '@cf/meta/llama-3.1-8b-instruct' }}
          ENVIRONMENT: 'production'
          RATE_LIMIT_DELAY_SECONDS: '2.0'
        run: |
          python -m engine.app.jobs.scholarship_discovery_job

